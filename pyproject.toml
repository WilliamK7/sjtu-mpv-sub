[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sjtu-mpv-sub"
version = "0.1.0"
description = "Streaming bilingual lecture player for SJTU recording system using mpv EDL and Aliyun DashScope."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
sjtu-mpv-sub = "sjtu_mpv_sub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sjtu_mpv_sub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
